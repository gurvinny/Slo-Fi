# Browser QA
# Author: gurvinny
#
# Typecheck and build cannot tell whether anything actually renders. The orb
# has failed in production twice while CI was green -- once from a renderer
# swap that could not draw the scene's materials, once from a stale service
# worker serving an index.html with dead chunk hashes. This drives a real
# browser against the built output instead.
#
# Sharded across runners, not across workers. SwiftShader is CPU-bound and the
# suite's 120s timeouts were tuned after tests timed out at 60s on a loaded
# host, so raising `workers` would buy parallelism by making every test slower
# and reintroduce exactly that failure. Each shard keeps workers: 1 and gets a
# runner to itself.
#
# Eight shards, measured rather than guessed. Because fullyParallel is false,
# Playwright shards at FILE granularity, so [desktop-software-gl]
# anomaly-sphere.spec.ts is a single atomic ~335s block. Simulating the real
# assignment against measured per-test durations:
#
#   4 shards -> max 481s (~9.5 min)     6 shards -> max 398s (~8.1 min)
#   8 shards -> max 335s (~7.1 min)    10 shards -> max 335s, no further gain
#
# Eight is where the split reaches that atomic block and stops improving. Going
# below test-file granularity would mean fullyParallel: true, which changes
# isolation semantics in a suite whose entire job is catching renderer
# regressions -- not worth 3 minutes without first proving the specs are
# order-independent.
#
# NOTE: the aggregate job below is named "Browser QA" because that is the
# required status check. Matrix jobs report as "... (1)", "... (2)" and so on,
# so promoting the matrix itself would leave the required context permanently
# pending and deadlock every PR. Keep the name in sync with the ruleset.
name: Browser QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    name: shard ${{ matrix.shard }} of 8
    runs-on: ubuntu-latest
    strategy:
      # Report every shard's result. Cancelling siblings on the first failure
      # hides whether a break is one spec or the whole renderer, which is the
      # first thing worth knowing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Cache the browser binary across shards. Eight runners each downloading
      # ~180MB of Chromium is the single largest fixed cost left in this job --
      # measured at roughly 30-45s of a ~46s setup.
      #
      # Keyed on the resolved @playwright/test version rather than on a lockfile
      # hash: the binary revision is pinned by that package, so an unrelated
      # dependency bump must not evict a still-valid browser, and a Playwright
      # bump must evict it. Deriving the key from package-lock.json directly
      # would get both of those backwards.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # The cache holds the browser, never the apt packages it links against, so
      # install-deps still runs on a hit. It is the cheap half.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build
        run: npm run build

      - name: Run browser QA
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/8 --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload failure screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: Browser QA
    runs-on: ubuntu-latest
    needs: shard
    # Runs even when a shard fails, so the merged report covers the failure
    # rather than only ever describing green runs.
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into one report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      # The merge step above succeeds on a report full of failures, so the
      # shard results are what this check actually reports. Without this the
      # required check would go green whenever the reporting worked.
      - name: Report shard results
        if: ${{ needs.shard.result != 'success' }}
        run: |
          echo "::error::at least one Browser QA shard failed (${{ needs.shard.result }})"
          exit 1
