# Slo-Fi CI
# Author: gurvinny
#
# The merge gate. `Build & Typecheck` verifies the two things a dependency bump
# can break -- that the project still typechecks and still builds -- and
# `Tests` runs the unit suite over the DSP and data layers.
#
# The two are separate jobs so a failure names itself: a red `Tests` is a
# behaviour regression, a red `Build & Typecheck` is a compile or bundling
# problem, and they are rarely fixed the same way.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Build
        run: npm run build

      # The service worker precaches with cache.addAll, which is atomic and
      # unconditional -- every URL in that list is fetched by every visitor
      # before the worker activates. It once carried ~197 KB gzip of WebGPU
      # code the runtime cannot reach. tests/unit/precache.test.ts covers the
      # selection; this reads the built dist/sw.js, which is the only thing
      # that proves the build wired it in.
      - name: Verify the shipped precache list
        run: node scripts/check-precache.mjs

  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # A test file that is silently never executed is the one failure a test
      # suite cannot catch by testing harder -- SPECTRE's runner once executed
      # 4 of 28 files and reported success.
      # Chromium is needed because test:verify also counts the browser suite,
      # which runs the real Web Audio render path.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Runs all three suites (unit, browser, jsdom) AND asserts every test file
      # on disk was collected.
      - name: Run tests
        run: npm run test:verify

      - name: Coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
