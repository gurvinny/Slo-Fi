# Deploy to Cloudflare Workers
# Author: gurvinny
#
# Production used to be promoted by hand with `wrangler deploy`, which meant it
# drifted: the git-connected Workers Build uploads a *version* on every push but
# never promotes it, so the versions list looked busy while production sat seven
# weeks behind main. A healthy version feed is exactly what a stalled deploy
# looks like.
#
# This makes the deploy automatic and conditional instead. The gate is the point:
# `deploy` runs only after typecheck, build and a real-browser render check have
# all passed on the same commit, so nothing reaches slofi.live that CI would have
# rejected. Lighthouse is deliberately NOT a gate -- a performance regression
# should be visible, not block a correctness fix from shipping.
name: Deploy

on:
  push:
    branches: [ main ]
  # Manual re-run, for when a deploy needs repeating without a new commit.
  workflow_dispatch:

# Least privilege: the deploy talks to Cloudflare, not to the repository.
permissions:
  contents: read

# Never let two deploys race. Unlike CI, in-progress runs are NOT cancelled:
# cancelling a half-finished upload is worse than letting it land.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

  render:
    name: Render check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Browser QA
        run: npm run test:e2e
      - name: Upload report on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-render-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Deploy to Cloudflare
    needs: [verify, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci

      # Fail loudly and early rather than letting wrangler emit an opaque auth
      # error halfway through an upload.
      - name: Check credentials are present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
              echo "::error::missing repository secret(s):$missing"
              echo "The token needs the Workers Scripts:Edit permission." >&2
              exit 1
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

      # The failure this workflow exists to prevent is an upload that never
      # gets promoted, so wrangler's exit code is not taken as proof.
      #
      # This asks Cloudflare which version is actually SERVING rather than
      # polling slofi.live: the public URL goes through the edge cache, which
      # served stale HTML for minutes after the first real deploy and failed
      # this step while the deploy had in fact succeeded. The deployments
      # endpoint has no such lag, and it distinguishes a promotion from a
      # version upload -- which the HTML never could.
      - name: Confirm the build was promoted, not just uploaded
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/slo-fi/deployments"
          resp=$(curl -sS --max-time 30 "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if [ "$(jq -r '.success' <<<"$resp")" != "true" ]; then
              echo "::error::could not read deployments: $(jq -c '.errors' <<<"$resp")"
              echo "the token needs Workers Scripts read access as well as edit" >&2
              exit 1
          fi

          latest=$(jq -r '.result.deployments | sort_by(.created_on) | last | .created_on' <<<"$resp")
          echo "most recent promotion: $latest"

          # A promotion older than this run means wrangler uploaded a version
          # and stopped -- the exact silent failure being guarded against.
          age=$(( $(date -u +%s) - $(date -u -d "$latest" +%s) ))
          echo "promoted $age seconds ago"
          if [ "$age" -gt 900 ]; then
              echo "::error::no promotion from this run; newest deployment is ${age}s old"
              exit 1
          fi
          echo "a new deployment was promoted by this run"

      # Informational only. The edge cache can lag a promotion by minutes, so
      # a mismatch here is not grounds to fail a deploy that Cloudflare has
      # already confirmed.
      - name: Report what the edge is serving
        continue-on-error: true
        run: |
          built=$(basename "$(ls dist/assets/index-*.js | head -1)")
          live=$(curl -s --max-time 20 "https://slofi.live/?_cb=$(date +%s)" \
                 | grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' | head -1) || true
          echo "built: $built"
          echo "edge:  ${live:-<not matched>}"
          [ "$(basename "${live:-x}")" = "$built" ] \
              && echo "edge is already serving this build" \
              || echo "edge has not caught up yet, which is normal immediately after a deploy"
